name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The library the Go tests load is a build artifact, so build it once and
  # share it rather than rebuilding it in each job.
  lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: ./scripts/build-lib.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lib-linux_amd64
          path: libs/linux_amd64/lib/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cd rust && cargo fmt --check
      - run: cd rust && cargo clippy --all-targets -- -D warnings
      - run: cd rust && cargo test

  go:
    needs: lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/download-artifact@v4
        with:
          name: lib-linux_amd64
          path: libs/linux_amd64/lib/
      - run: go vet ./...
      - name: gofmt
        run: |
          out=$(gofmt -l . | grep -v '^rust/' || true)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      # The suite runs the way users build: no C toolchain involved.
      - run: CGO_ENABLED=0 go test -count=1 ./...
      - run: go test -race -count=1 ./...

  # The libraries under libs/ are build output. Only the build-libs workflow
  # commits them, and only after every one has passed its smoke job on real
  # hardware of that platform. A .gitignore cannot enforce that: ignore rules
  # do not apply to tracked files, so the moment the workflow commits them a
  # stray `git add -A` picks them up again -- which is exactly how a
  # locally-built, never-smoke-tested library reached main once already.
  no-hand-built-libs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse hand-committed libraries
        run: |
          changed=$(git diff --name-only \
            "origin/${{ github.base_ref }}...HEAD" -- 'libs/*/lib/iroh_go.lib*')
          if [ -n "$changed" ]; then
            echo "::error::these are build output and only build-libs may commit them:"
            echo "$changed"
            echo
            echo "restore them with:  git checkout origin/${{ github.base_ref }} -- libs/"
            exit 1
          fi
          echo "no hand-committed libraries"

  # Runs the suite against the libraries checked into libs/, with no Rust
  # toolchain and nothing built fresh -- the pair a consumer actually gets.
  #
  # The `go` job above builds the library from the current source, so it always
  # tests a matching pair and stays green even when the committed libraries are
  # stale. That is the window between merging a change under rust/ and running
  # build-libs, and during it `go get` is broken for everyone while CI says
  # nothing. This job is what closes it: the loader's ABI check fails here
  # exactly when the two have drifted apart.
  committed-libs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Set via env rather than `CGO_ENABLED=0 go test`: the default shell on
      # the Windows runners is PowerShell, which has no inline assignment.
      - run: go test -count=1 ./...
        env:
          CGO_ENABLED: "0"

  # The point of the whole exercise: every target still builds with no C
  # compiler and no cgo.
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make cross
